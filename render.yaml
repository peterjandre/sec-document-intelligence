services:
  - type: web
    name: sec-filing-api
    runtime: python
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://your-vercel-domain.vercel.app
      - key: EXTRACTOR_CLI_PATH
        value: /opt/render/project/src/services/extractor-csharp/bin/Release/net8.0/extractor
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
